<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾色年鉴 Huedays</title>
  <style>
:root {
  --paper: #FAF9F6;
  --ink: #302D29;
  --soft: #746F66;
  --line: #EAE7E0;
  --accent: #3E4539;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.top {
  max-width: 40rem;
  margin: 0 auto;
  padding: 1.5rem 1.5rem 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
  align-items: baseline;
  justify-content: space-between;
}
.brand {
  color: var(--ink);
  text-decoration: none;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.brand span, h1 span { color: var(--soft); font-weight: 500; }
nav { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; }
nav a, .langs a, .links a {
  color: var(--accent);
  text-decoration: none;
}
nav a[aria-current="page"] { color: var(--ink); }
nav a:hover, .langs a:hover, .links a:hover, .brand:hover { text-decoration: underline; }
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}
.langs { color: var(--soft); font-size: 0.95rem; margin: 0 0 2rem; }
h1 { font-size: 1.75rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; margin: 0 0 0.5rem; }
h2 { font-size: 1.1rem; font-weight: 650; margin: 1.75rem 0 0.4rem; }
.updated { color: var(--soft); font-size: 0.9rem; margin: 0 0 1.25rem; }
.intro { margin: 0 0 0.5rem; }
article p { margin: 0 0 0.25rem; }
article + article {
  margin-top: 3rem;
  padding-top: 3rem;
  border-top: 1px solid var(--line);
}
.links { list-style: none; padding: 0; margin: 2rem 0 0; }
.links li { margin: 0 0 0.85rem; }
.links a { font-size: 1.1rem; }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">拾色年鉴 <span>Huedays</span></a>
    <nav>
      <a href="privacy.html">隐私政策 / Privacy</a>
      <a href="terms.html">使用条款 / Terms</a>
    </nav>
  </header>
  <main>
    <h1>拾色年鉴 <span>Huedays</span></h1>
    <ul class="links">
      <li><a href="privacy.html">隐私政策 / Privacy Policy</a></li>
      <li><a href="terms.html">使用条款 / Terms of Use</a></li>
    </ul>
    <h2>联系与支持 / Support</h2>
    <p>有问题或建议，请发邮件至 / Questions or feedback: <a href="mailto:junhuihe1128@gmail.com">junhuihe1128@gmail.com</a></p>
  </main>
</body>
</html>
